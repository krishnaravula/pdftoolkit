name: pdf_toolkit
description: Offline PDF merge, split, compress, scan, and edit toolkit.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  pdfrx: ^2.4.4
  image: ^4.9.1
  cunning_document_scanner: ^1.4.0
  crop_your_image: ^2.0.0
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^11.1.0
  open_filex: ^4.7.0
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0+eol
  permission_handler: ^12.0.0
  in_app_purchase: ^3.2.1
  google_mobile_ads: ^9.0.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  cross_file: ^0.3.4+2
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: store/app_icon.png
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: store/app_icon.png

flutter:
  uses-material-design: true
