name: Build launch APK
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
        continue-on-error: true
      - run: flutter analyze --no-pub
        continue-on-error: true
      - run: flutter test --no-pub
      - name: Configure disposable build signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/build.jks" -storepass disposable -keypass disposable -alias build -keyalg RSA -keysize 2048 -validity 7 -dname CN=Temporary
          printf 'storeFile=%s\nstorePassword=disposable\nkeyPassword=disposable\nkeyAlias=build\n' "$RUNNER_TEMP/build.jks" > android/key.properties
      - run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
