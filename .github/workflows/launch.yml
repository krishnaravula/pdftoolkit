name: Build launch APK
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
        continue-on-error: true
      - run: flutter analyze --no-pub
        continue-on-error: true
      - name: Install PDFium for Linux widget and service tests
        run: |
          mkdir -p "$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64/lib"
          curl --fail --silent --show-error --location 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz' | tar -xz -C "$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64" lib/libpdfium.so
      - name: Run unit and widget tests
        run: flutter test --no-pub test
      - name: Configure disposable build signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/build.jks" -storepass disposable -keypass disposable -alias build -keyalg RSA -keysize 2048 -validity 7 -dname CN=Temporary
          printf 'storeFile=%s\nstorePassword=disposable\nkeyPassword=disposable\nkeyAlias=build\n' "$RUNNER_TEMP/build.jks" > android/key.properties
      # Let Flutter regenerate the release registrant without dev-only plugins.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  android-integration:
    name: Android integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Use the Flutter driver to collect the on-device test results without DDS.
          script: >-
            timeout 15m flutter drive --no-pub --no-dds --timeout=180 -d emulator-5554
            --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart
            || { result=$?; adb logcat -d -b crash; exit "$result"; }
